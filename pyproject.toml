[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-updater"
version = "1.1.1"
description = "Shared GitHub release updater for Python desktop applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "reserve85" },
]
keywords = ["updater", "github", "release", "auto-update"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/reserve85/github_updater"
Repository = "https://github.com/reserve85/github_updater"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
